name: Flarial APK Full Decompilation

on:
  push:
    paths:
      - 'apks/**'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Decompile Java/Kotlin from base APK using JADX v1.5.6
  # ─────────────────────────────────────────────────────────────
  decompile-java:
    name: Java/Kotlin (JADX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JADX 1.5.6
        run: |
          wget -q "https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip" -O jadx.zip
          unzip -q jadx.zip -d jadx
          echo "$GITHUB_WORKSPACE/jadx/bin" >> $GITHUB_PATH

      - name: Verify JADX
        run: jadx --version

      - name: Decompile base APK (Flarial-1.3.15) with JADX
        run: |
          mkdir -p decompiled/Flarial-1.3.15
          # Exit code 3 = finished with some decompile errors (normal for obfuscated APKs)
          # Output is still fully generated — treat it as success
          jadx \
            --threads-count 4 \
            --deobf \
            --show-bad-code \
            -d decompiled/Flarial-1.3.15 \
            apks/Flarial-1.3.15.apk || EXIT=$?
          if [ "${EXIT:-0}" -eq 3 ]; then
            echo "⚠️ JADX finished with minor decompile errors (exit 3) — output still valid"
          elif [ "${EXIT:-0}" -ne 0 ]; then
            echo "❌ JADX failed with exit code $EXIT"
            exit $EXIT
          fi
          echo "✅ Flarial-1.3.15.apk decompiled ($(find decompiled/Flarial-1.3.15 -name '*.java' | wc -l) java files)"

      - name: Decompile config.en APK (language resources)
        run: |
          mkdir -p decompiled/config.en
          jadx --threads-count 2 -d decompiled/config.en apks/config.en.apk || true
          echo "✅ config.en.apk done"

      - name: Decompile config.xxhdpi APK (drawable resources)
        run: |
          mkdir -p decompiled/config.xxhdpi
          jadx --threads-count 2 -d decompiled/config.xxhdpi apks/config.xxhdpi.apk || true
          echo "✅ config.xxhdpi.apk done"

      - name: Upload Java Sources
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-java-sources
          path: decompiled/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 2: Decode XML & resources using Apktool v3.0.3
  # ──────────────────────────────────────────────────────────────
  decode-resources:
    name: XML/Resources (Apktool)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool 3.0.3
        run: |
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" -O /usr/local/bin/apktool.jar
          printf '#!/bin/bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool

      - name: Verify Apktool
        run: apktool --version

      - name: Decode base APK resources
        run: |
          apktool d apks/Flarial-1.3.15.apk -o apktool-decoded/Flarial-1.3.15 -f
          echo "✅ Resources decoded for Flarial-1.3.15.apk"

      - name: Decode config.en resources
        run: |
          apktool d apks/config.en.apk -o apktool-decoded/config.en -f
          echo "✅ Resources decoded for config.en.apk"

      - name: Decode config.xxhdpi resources
        run: |
          apktool d apks/config.xxhdpi.apk -o apktool-decoded/config.xxhdpi -f
          echo "✅ Resources decoded for config.xxhdpi.apk"

      - name: Upload Decoded Resources
        uses: actions/upload-artifact@v4
        with:
          name: decoded-resources
          path: apktool-decoded/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 3: Decompile .so files using Ghidra 12.1.4 (Headless)
  # ──────────────────────────────────────────────────────────────
  decompile-native:
    name: Native .so (Ghidra)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Ghidra 12.1.4
        uses: antoniovazquezblanco/setup-ghidra@v2.2.1
        with:
          version: '12.1.4'

      - name: Install unzip
        run: sudo apt-get install -y unzip

      - name: Extract .so files from config.arm64_v8a.apk
        run: |
          mkdir -p extracted_so
          unzip -j apks/config.arm64_v8a.apk "lib/arm64-v8a/*.so" -d extracted_so
          echo "Extracted .so files:"
          ls -lh extracted_so/

      - name: Create Ghidra decompiler Python script
        run: |
          mkdir -p ghidra_scripts ghidra_output
          cat << 'PYEOF' > ghidra_scripts/ExportDecompiledC.py
          # @author Antigravity Auto-Decompiler
          # @category Analysis

          from ghidra.app.decompiler import DecompInterface
          from ghidra.util.task import ConsoleTaskMonitor
          import os

          monitor = ConsoleTaskMonitor()
          ifc = DecompInterface()
          ifc.openProgram(currentProgram)

          prog_name = currentProgram.getName()

          # Receive output directory as script argument (passed via -scriptArgs)
          args = getScriptArgs()
          output_base = args[0] if args else "/tmp/ghidra_out"
          output_file = os.path.join(output_base, prog_name + ".c")

          print("[*] Writing decompiled output to: " + output_file)

          with open(output_file, "w") as f:
              f.write("// ================================================\n")
              f.write("// Ghidra Headless Auto-Decompiled: " + prog_name + "\n")
              f.write("// Architecture: ARM64\n")
              f.write("// ================================================\n\n")
              funcs = currentProgram.getFunctionManager().getFunctions(True)
              for func in funcs:
                  result = ifc.decompileFunction(func, 60, monitor)
                  if result and result.decompileCompleted():
                      f.write("// ---- " + func.getName() + " at " + str(func.getEntryPoint()) + " ----\n")
                      f.write(result.getDecompiledFunction().getC())
                      f.write("\n\n")
                  else:
                      f.write("// [SKIP] " + func.getName() + "\n\n")

          print("[+] Done: " + output_file)
          PYEOF

      - name: Decompile all .so files with Ghidra Headless
        run: |
          mkdir -p ghidra_output ghidra_projects
          GHIDRA_OUT="$(pwd)/ghidra_output"

          for so_file in extracted_so/*.so; do
            lib_name=$(basename "$so_file")
            echo ""
            echo "═══════════════════════════════════════"
            echo "  Decompiling: $lib_name"
            echo "═══════════════════════════════════════"
            "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
              "$(pwd)/ghidra_projects" \
              "proj_${lib_name}" \
              -import "$so_file" \
              -scriptPath "$(pwd)/ghidra_scripts" \
              -postScript ExportDecompiledC.py "$GHIDRA_OUT" \
              -deleteProject \
              -max-cpu 4 \
              2>&1 | tail -n 10
            echo "✅ Done: $lib_name"
          done

      - name: List decompiled native output
        run: |
          echo "=== Ghidra Output Files ==="
          ls -lh ghidra_output/ || echo "(empty)"
          echo "Total lines:"
          wc -l ghidra_output/*.c 2>/dev/null || echo "0"

      - name: Upload Native Decompiled Sources
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-native-so
          path: ghidra_output/
          retention-days: 7
